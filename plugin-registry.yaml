# indiekit-plugin-registry
#
# Central catalog of Indiekit plugins consumed by indiekit-cloudron as a git
# submodule. See README.md for the bump workflow and schema documentation.
# (indiekit-deploy integration is planned but not yet implemented.)
#
# Tier semantics:
#   core         — always installed and loaded; cannot be disabled per-site
#   post_types   — content type plugins; per-site can enable/disable
#   syndicators  — cross-posting targets; per-site can enable/disable
#   endpoints    — feature endpoints; per-site can enable/disable
#
# Entry fields:
#   key              — short identifier used in sites/*/config/plugins.yaml (kebab-case)
#   package          — npm package name (@scope/name)
#   version          — semver range (omitted when `overridden: true`)
#   overridden       — package.json `overrides` field swaps this for an @rmdes/* fork
#   library          — helper library imported by plugins (not a plugin itself; install only)
#   default_enabled  — whether this is on by default when a site doesn't list it

# Core — always installed and loaded; cannot be disabled per-site
core:
  - key: site-config
    package: "@rmdes/indiekit-endpoint-site-config"
    version: "^1.0.0-beta.35"
  - key: startup-gate
    package: "@rmdes/indiekit-startup-gate"
    version: "^1.0.0"
    library: true   # Helper library imported by other plugins; never listed in indiekit.config.js plugins array
  - key: auth
    package: "@indiekit/endpoint-auth"
    overridden: true   # package.json `overrides` swaps in @rmdes/indiekit-endpoint-auth
  - key: posts
    package: "@indiekit/endpoint-posts"
    overridden: true
  - key: micropub
    package: "@indiekit/endpoint-micropub"
    overridden: true
  - key: syndicate
    package: "@indiekit/endpoint-syndicate"
    overridden: true
  - key: files
    package: "@indiekit/endpoint-files"
    overridden: true
  - key: share
    package: "@indiekit/endpoint-share"
    overridden: true
  - key: frontend
    package: "@indiekit/frontend"
    overridden: true
  - key: preset-eleventy
    package: "@rmdes/indiekit-preset-eleventy"
    version: "^1.0.0-beta.39"
  - key: store-file-system
    package: "@indiekit/store-file-system"
    version: "^1.0.0-beta.27"   # @indiekit/* publishes betas; ^1.0.0 doesn't match prereleases
  - key: post-type-page
    package: "@rmdes/indiekit-post-type-page"
    version: "^1.0.5"
  - key: json-feed
    package: "@indiekit/endpoint-json-feed"
    version: "^1.0.0-beta.25"   # @indiekit/* publishes betas; ^1.0.0 doesn't match prereleases

post_types:
  - key: article
    package: "@indiekit/post-type-article"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: note
    package: "@indiekit/post-type-note"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: photo
    package: "@indiekit/post-type-photo"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: bookmark
    package: "@indiekit/post-type-bookmark"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: reply
    package: "@indiekit/post-type-reply"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: repost
    package: "@indiekit/post-type-repost"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: like
    package: "@indiekit/post-type-like"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: video
    package: "@indiekit/post-type-video"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: audio
    package: "@indiekit/post-type-audio"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: event
    package: "@indiekit/post-type-event"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: jam
    package: "@indiekit/post-type-jam"
    version: "^1.0.0-beta.28"
    default_enabled: true
  - key: rsvp
    package: "@indiekit/post-type-rsvp"
    version: "^1.0.0-beta.28"
    default_enabled: true

syndicators:
  - key: mastodon
    package: "@rmdes/indiekit-syndicator-mastodon"
    version: "^1.1.1"
    default_enabled: true
  - key: bluesky
    package: "@rmdes/indiekit-syndicator-bluesky"
    version: "^1.1.1"
    default_enabled: true
  - key: linkedin
    package: "@rmdes/indiekit-syndicator-linkedin"
    version: "^1.0.5"
    default_enabled: true
  - key: indienews
    package: "@rmdes/indiekit-syndicator-indienews"
    version: "^1.0.3"
    default_enabled: true

endpoints:
  - key: webmention-io
    package: "@rmdes/indiekit-endpoint-webmention-io"
    version: "^1.1.2"  # 1.1.2: normalise blocked domains + keep enforcing the blocklist
    default_enabled: true
  - key: webmention-sender
    package: "@rmdes/indiekit-endpoint-webmention-sender"
    version: "^1.1.4"  # 1.1.4: extract targets from the rendered page, not stored content
    default_enabled: true
  - key: comments
    package: "@rmdes/indiekit-endpoint-comments"
    version: "^1.4.0"
    default_enabled: true
  - key: blogroll
    package: "@rmdes/indiekit-endpoint-blogroll"
    version: "^1.0.27"
    default_enabled: true
  - key: podroll
    package: "@rmdes/indiekit-endpoint-podroll"
    version: "^1.0.16"
    default_enabled: true
  - key: rss
    package: "@rmdes/indiekit-endpoint-rss"
    version: "^1.2.4"   # 1.2.4: content field no longer prefills the stripping template
    default_enabled: true
  - key: microsub
    package: "@rmdes/indiekit-endpoint-microsub"
    version: "^1.0.68"
    default_enabled: true
  - key: readlater
    package: "@rmdes/indiekit-endpoint-readlater"
    version: "^1.0.8"
    default_enabled: true
  - key: conversations
    package: "@rmdes/indiekit-endpoint-conversations"
    version: "^2.4.3"
    default_enabled: true
  - key: activitypub
    package: "@rmdes/indiekit-endpoint-activitypub"
    # The single-lane core refactor now lives on main (merged 2026-09-05), so
    # this is no longer a branch-only build. Exact prerelease pin is still
    # required: ^4.1.0 does NOT match 4.1.0-beta.2, because npm ranges exclude
    # prereleases unless the range itself carries one.
    # REVERT: set back to "^4.0.0" — that release predates the refactor.
    version: "^4.1.0-beta.3"
    default_enabled: true
  - key: github
    package: "@rmdes/indiekit-endpoint-github"
    version: "^1.2.11"  # 1.2.11: real PR titles, bounded featured fetch
    default_enabled: true
  - key: funkwhale
    package: "@rmdes/indiekit-endpoint-funkwhale"
    version: "^1.0.16"
    default_enabled: true
  - key: lastfm
    package: "@rmdes/indiekit-endpoint-lastfm"
    version: "^1.0.15"
    default_enabled: true
  - key: youtube
    package: "@rmdes/indiekit-endpoint-youtube"
    version: "^1.2.5"
    default_enabled: true
  - key: linkedin-oauth
    package: "@rmdes/indiekit-endpoint-linkedin"
    version: "^1.0.8"
    default_enabled: true
  - key: cv
    package: "@rmdes/indiekit-endpoint-cv"
    version: "^1.1.4"
    default_enabled: true
  - key: donation
    package: "@rmdes/indiekit-endpoint-donation"
    version: "^0.1.0-alpha.5"   # alpha.4: donation-campaign v2 block + public hardened stats API
    default_enabled: true
  - key: bluesky-pds
    package: "@rmdes/indiekit-endpoint-bluesky-pds"
    version: "^0.1.0"
    default_enabled: false
